version: 2
updates:
  # Runtime deps are pinned tightly (webtorrent@^3, the @eggjs/ip override and
  # the approved native install scripts), so surface upgrades as reviewable PRs
  # instead of letting them rot until a security advisory lands.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      torrent-engine:
        patterns:
          - webtorrent
          - parse-torrent
          - node-datachannel
          - utp-native
          - bufferutil
          - utf-8-validate

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
