name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # webtorrent@3 needs Node >= 22; .npmrc sets engine-strict=true, so an
      # old runtime fails here with a clear message instead of at runtime.
      - run: npm ci

      - run: npm run typecheck

      - name: Unit tests (node:test)
        run: npm test

      - run: npm run build

      - name: Turbo HTTP compatibility matrix
        run: npm run smoke

      - name: Classifier + parser regressions
        run: |
          node tools/classify-smoke.mjs
          node tools/tv-smoke.mjs

      - name: Ink render smokes
        run: |
          npx tsx tools/render-smoke.tsx
          node tools/tv-render.mjs

      - name: App mount smoke (history + state.json)
        run: npx tsx tools/app-smoke.tsx

      - name: Doctor report (offline)
        run: node dist/cli.js --doctor --offline
