name: Release

# Tag-driven release: `npm version patch|minor` then `git push --follow-tags`
# publishes to npm with provenance and attaches the packed tarball to the
# GitHub release. Requires an NPM_TOKEN repository secret (npm automation
# token) — without it the publish step fails loudly, which is intentional.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Same gate as CI: never publish something the suite does not pass.
      - run: npm run check

      - run: npm pack
        id: pack

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the tarball to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: torrential-*.tgz
          generate_release_notes: true
